name = "lazywinadmin-blog-mcp"
main = "src/index.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public, read-only JSON index generated by Jekyll (api/posts.json). No secrets needed.
INDEX_URL = "https://lazywinadmin.com/api/posts.json"
# Seconds to keep the index in memory / edge cache.
INDEX_TTL = "600"

# Optional custom domain (uncomment after the zone is on Cloudflare - it is):
# routes = [{ pattern = "mcp.lazywinadmin.com", custom_domain = true }]
