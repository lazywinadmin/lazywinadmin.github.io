{%- if page.collection == 'posts' -%}
{%- assign ld_image = page.header.og_image | default: page.header.overlay_image | default: page.header.image | default: page.header.teaser | default: site.og_image -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | strip_html | jsonify }},
  "description": {{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "author": { "@type": "Person", "name": "François-Xavier Cat", "url": {{ site.url | append: '/about.html' | jsonify }} },
  "publisher": { "@type": "Organization", "name": {{ site.title | jsonify }}, "logo": { "@type": "ImageObject", "url": {{ site.logo | absolute_url | jsonify }} } },
  "image": {{ ld_image | absolute_url | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.url | absolute_url | jsonify }} }
}
</script>
{%- endif -%}
