name: cv-pdf

on:
  push:
    branches: [master]
    paths:
      - "_includes/cv.md"
      - "cv/cv-template.css"
      - ".github/workflows/cv-pdf.yml"
  pull_request:
    paths:
      - "_includes/cv.md"
      - "cv/cv-template.css"
      - ".github/workflows/cv-pdf.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cv-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint fonts-dejavu

      - name: Build PDF
        run: |
          mkdir -p cv
          pandoc _includes/cv.md \
            --from gfm --standalone \
            --metadata title="François-Xavier Cat - CV" \
            --css cv/cv-template.css \
            --pdf-engine=weasyprint \
            -o cv/fx-cv.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: fx-cv
          path: cv/fx-cv.pdf

      - name: Commit PDF to master if changed
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add cv/fx-cv.pdf
          if git diff --cached --quiet; then echo "PDF unchanged"; exit 0; fi
          git commit -m "Update CV PDF [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
